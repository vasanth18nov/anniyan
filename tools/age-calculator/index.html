<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Age Calculator — Free Online Tool | Anniyan</title>
<meta name="description" content="Calculate exact age in years, months and days from a date of birth." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/age-calculator/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2312b886'/%3E%3Cstop offset='1' stop-color='%23f5a623'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath fill='%230a0b10' d='M50 18 L78 68 L60 68 L50 50 L40 68 L22 68 Z'/%3E%3Cpath fill='%230a0b10' opacity='0.55' d='M32 82 L50 50 L68 82 Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Calculators</p>
    <h1>Age Calculator</h1>
    <p>Calculate exact age in years, months and days, plus how long until the next birthday.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label for="dob">Date of Birth</label>
        <input class="tool-input" id="dob" type="date" />
      </div>
      <div class="tool-field">
        <label for="asOf">As Of</label>
        <input class="tool-input" id="asOf" type="date" />
      </div>
    </div>

    <div class="tool-stats">
      <div class="tool-stat"><div class="tool-stat-value" id="statYears">—</div><div class="tool-stat-label">Years</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statMonths">—</div><div class="tool-stat-label">Months</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statDays">—</div><div class="tool-stat-label">Days</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statTotalDays">—</div><div class="tool-stat-label">Total Days Lived</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statNextBday">—</div><div class="tool-stat-label">Days to Next Birthday</div></div>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var dobInput = document.getElementById("dob");
  var asOfInput = document.getElementById("asOf");
  var status = document.getElementById("status");

  function calc() {
    if (!dobInput.value) {
      status.textContent = "Enter a date of birth.";
      return;
    }
    var dob = new Date(dobInput.value + "T00:00:00");
    var asOf = asOfInput.value ? new Date(asOfInput.value + "T00:00:00") : new Date(new Date().toDateString());

    if (dob > asOf) {
      status.textContent = "Date of birth is after the 'as of' date.";
      return;
    }

    var years = asOf.getFullYear() - dob.getFullYear();
    var months = asOf.getMonth() - dob.getMonth();
    var days = asOf.getDate() - dob.getDate();
    if (days < 0) {
      months--;
      var prevMonthLastDay = new Date(asOf.getFullYear(), asOf.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if (months < 0) { years--; months += 12; }

    var msPerDay = 24 * 60 * 60 * 1000;
    var totalDays = Math.round((asOf - dob) / msPerDay);

    var nextBday = new Date(asOf.getFullYear(), dob.getMonth(), dob.getDate());
    if (nextBday < asOf) nextBday = new Date(asOf.getFullYear() + 1, dob.getMonth(), dob.getDate());
    var daysToNext = Math.round((nextBday - asOf) / msPerDay);

    document.getElementById("statYears").textContent = years;
    document.getElementById("statMonths").textContent = months;
    document.getElementById("statDays").textContent = days;
    document.getElementById("statTotalDays").textContent = totalDays.toLocaleString();
    document.getElementById("statNextBday").textContent = daysToNext;
    status.textContent = "";
  }

  dobInput.addEventListener("input", calc);
  asOfInput.addEventListener("input", calc);

  asOfInput.value = new Date().toISOString().slice(0, 10);
  dobInput.value = "1995-06-15";
  calc();
})();
</script>
</body>
</html>
