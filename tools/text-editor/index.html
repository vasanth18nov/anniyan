<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Text Editor — Free Online Tool | Anniyan</title>
<meta name="description" content="A distraction-free online text editor with autosave. Nothing leaves your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/text-editor/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2312b886'/%3E%3Cstop offset='1' stop-color='%23f5a623'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath fill='%230a0b10' d='M50 18 L78 68 L60 68 L50 50 L40 68 L22 68 Z'/%3E%3Cpath fill='%230a0b10' opacity='0.55' d='M32 82 L50 50 L68 82 Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Text &amp; Writing</p>
    <h1>Text Editor</h1>
    <p>Distraction-free writing space with autosave. Everything stays in your browser — nothing is uploaded anywhere.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-toolbar">
      <button class="btn btn-outline btn-sm" id="btnNew" type="button">New</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy</button>
      <button class="btn btn-outline btn-sm" id="btnDownload" type="button">Download .txt</button>
    </div>
    <textarea class="tool-textarea" id="editor" placeholder="Start typing…" spellcheck="true" style="min-height: 480px;"></textarea>
    <p class="tool-status" id="status">Autosave on — your draft is saved to this browser as you type.</p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "anniyan-text-editor-draft";
  var editor = document.getElementById("editor");
  var status = document.getElementById("status");
  var saveTimer = null;

  var saved = localStorage.getItem(STORAGE_KEY);
  if (saved) editor.value = saved;

  function markSaved() {
    var now = new Date();
    var time = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    status.textContent = "Saved at " + time;
    status.classList.add("is-saved");
  }

  editor.addEventListener("input", function () {
    status.classList.remove("is-saved");
    status.textContent = "Typing…";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      localStorage.setItem(STORAGE_KEY, editor.value);
      markSaved();
    }, 500);
  });

  document.getElementById("btnNew").addEventListener("click", function () {
    if (editor.value && !confirm("Clear the current draft? This can't be undone.")) return;
    editor.value = "";
    localStorage.removeItem(STORAGE_KEY);
    status.classList.remove("is-saved");
    status.textContent = "Autosave on — your draft is saved to this browser as you type.";
    editor.focus();
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(editor.value).then(function () {
      status.textContent = "Copied to clipboard.";
      status.classList.remove("is-saved");
    });
  });

  document.getElementById("btnDownload").addEventListener("click", function () {
    var blob = new Blob([editor.value], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "document.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  if (saved) markSaved();
})();
</script>
</body>
</html>
