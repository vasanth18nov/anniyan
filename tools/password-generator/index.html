<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Generator — Free Online Tool | Anniyan</title>
<meta name="description" content="Create strong, random passwords instantly, generated locally in your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/password-generator/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2312b886'/%3E%3Cstop offset='1' stop-color='%23f5a623'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='url(%23g)'/%3E%3Cpath fill='%230a0b10' d='M50 18 L78 68 L60 68 L50 50 L40 68 L22 68 Z'/%3E%3Cpath fill='%230a0b10' opacity='0.55' d='M32 82 L50 50 L68 82 Z'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Generators</p>
    <h1>Password Generator</h1>
    <p>Create a strong, random password using your browser's cryptographic random number generator.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-copy-row">
      <input class="tool-input" id="result" type="text" readonly style="font-family: 'JetBrains Mono', monospace; font-size: 1.05rem;" />
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy</button>
      <button class="btn btn-primary btn-sm" id="btnGenerate" type="button">Generate</button>
    </div>

    <div class="tool-result" style="margin-top: 18px; padding: 16px;">
      <div class="tool-result-label" id="strengthLabel">Strength</div>
      <div class="tool-result-value" id="strengthValue" style="font-size: 1.3rem;">—</div>
    </div>

    <div class="tool-row" style="margin-top: 22px;">
      <div class="tool-field" style="flex: 1; min-width: 220px;">
        <label for="length">Length: <span id="lengthValue">16</span></label>
        <input type="range" id="length" min="4" max="64" value="16" />
      </div>
    </div>
    <div class="tool-row">
      <label class="tool-checkbox-row"><input type="checkbox" id="optUpper" checked /> Uppercase (A-Z)</label>
      <label class="tool-checkbox-row"><input type="checkbox" id="optLower" checked /> Lowercase (a-z)</label>
      <label class="tool-checkbox-row"><input type="checkbox" id="optNumbers" checked /> Numbers (0-9)</label>
      <label class="tool-checkbox-row"><input type="checkbox" id="optSymbols" checked /> Symbols (!@#$…)</label>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  var LOWER = "abcdefghijklmnopqrstuvwxyz";
  var NUMBERS = "0123456789";
  var SYMBOLS = "!@#$%^&*()-_=+[]{};:,.<>?";

  var lengthInput = document.getElementById("length");
  var lengthValue = document.getElementById("lengthValue");
  var result = document.getElementById("result");
  var status = document.getElementById("status");
  var strengthLabel = document.getElementById("strengthLabel");
  var strengthValue = document.getElementById("strengthValue");
  var opts = {
    upper: document.getElementById("optUpper"),
    lower: document.getElementById("optLower"),
    numbers: document.getElementById("optNumbers"),
    symbols: document.getElementById("optSymbols")
  };

  function randomInt(max) {
    var range = 256 - (256 % max);
    var byte;
    do { byte = crypto.getRandomValues(new Uint8Array(1))[0]; } while (byte >= range);
    return byte % max;
  }

  function buildCharset() {
    var set = "";
    if (opts.upper.checked) set += UPPER;
    if (opts.lower.checked) set += LOWER;
    if (opts.numbers.checked) set += NUMBERS;
    if (opts.symbols.checked) set += SYMBOLS;
    return set;
  }

  function strengthFor(length, charsetSize) {
    var bits = length * Math.log2(Math.max(charsetSize, 1));
    if (bits < 40) return { label: "Weak", color: "#ff6b6b" };
    if (bits < 64) return { label: "Fair", color: "#ffb020" };
    if (bits < 90) return { label: "Strong", color: "#2dd4bf" };
    return { label: "Very Strong", color: "#3ddc84" };
  }

  function generate() {
    var charset = buildCharset();
    if (!charset) {
      status.textContent = "Select at least one character type.";
      status.classList.remove("is-saved");
      return;
    }
    var length = parseInt(lengthInput.value, 10);
    var chars = [];
    for (var i = 0; i < length; i++) chars.push(charset[randomInt(charset.length)]);
    var password = chars.join("");
    result.value = password;

    var s = strengthFor(length, charset.length);
    strengthValue.textContent = s.label;
    strengthValue.style.backgroundImage = "none";
    strengthValue.style.webkitTextFillColor = "initial";
    strengthValue.style.color = s.color;
    status.textContent = "";
  }

  lengthInput.addEventListener("input", function () {
    lengthValue.textContent = lengthInput.value;
    generate();
  });
  Object.keys(opts).forEach(function (k) { opts[k].addEventListener("change", generate); });
  document.getElementById("btnGenerate").addEventListener("click", generate);
  document.getElementById("btnCopy").addEventListener("click", function () {
    if (!result.value) return;
    navigator.clipboard.writeText(result.value);
    status.textContent = "Copied to clipboard.";
    status.classList.add("is-saved");
  });

  generate();
})();
</script>
</body>
</html>
