<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XML to CSV — Free Online Tool | Anniyan</title>
<meta name="description" content="Convert structured XML data into CSV format instantly in your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/xml-to-csv/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300eaff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../../index.html#tools" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Data Conversion</p>
    <h1>XML to CSV</h1>
    <p>Paste XML with repeated record elements (like a list of items) and convert it to CSV. Works best with a flat, one-level record structure.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-toolbar">
      <button class="btn btn-primary btn-sm" id="btnConvert" type="button">Convert</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy CSV</button>
      <button class="btn btn-outline btn-sm" id="btnDownload" type="button">Download .csv</button>
      <button class="btn btn-outline btn-sm" id="btnClear" type="button">Clear</button>
    </div>
    <div class="tool-split">
      <div class="tool-split-col">
        <span class="tool-split-label">XML Input</span>
        <textarea class="tool-textarea" id="input" style="min-height:340px;"></textarea>
      </div>
      <div class="tool-split-col">
        <span class="tool-split-label">CSV Output</span>
        <textarea class="tool-textarea" id="output" readonly style="min-height:340px;"></textarea>
      </div>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../../index.html#tools">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var status = document.getElementById("status");

  var SAMPLE = "<people>\n  <person><name>Ravi</name><age>29</age><city>Chennai</city></person>\n  <person><name>Meera</name><age>34</age><city>Coimbatore</city></person>\n</people>";

  function toCsvValue(v) {
    if (v === undefined || v === null) v = "";
    v = String(v);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  function parseXmlToRecords(xmlText) {
    var doc = new DOMParser().parseFromString(xmlText, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error("That doesn't look like valid XML.");
    var root = doc.documentElement;
    if (!root) throw new Error("No root element found.");

    var children = Array.prototype.filter.call(root.children || [], function (el) { return el.nodeType === 1; });
    if (children.length === 0) throw new Error("No repeated record elements found under the root.");

    var tagCounts = {};
    children.forEach(function (el) { tagCounts[el.tagName] = (tagCounts[el.tagName] || 0) + 1; });
    var recordTag = Object.keys(tagCounts).sort(function (a, b) { return tagCounts[b] - tagCounts[a]; })[0];
    var records = children.filter(function (el) { return el.tagName === recordTag; });

    var fields = [];
    var rows = records.map(function (rec) {
      var row = {};
      var fieldEls = Array.prototype.filter.call(rec.children, function (el) { return el.nodeType === 1; });
      if (fieldEls.length === 0) {
        if (fields.indexOf(recordTag) === -1) fields.push(recordTag);
        row[recordTag] = rec.textContent.trim();
        return row;
      }
      fieldEls.forEach(function (field) {
        if (fields.indexOf(field.tagName) === -1) fields.push(field.tagName);
        row[field.tagName] = field.textContent.trim();
      });
      return row;
    });

    return { fields: fields, rows: rows, recordTag: recordTag };
  }

  document.getElementById("btnConvert").addEventListener("click", function () {
    try {
      var result = parseXmlToRecords(input.value);
      var lines = [result.fields.map(toCsvValue).join(",")];
      result.rows.forEach(function (row) {
        lines.push(result.fields.map(function (f) { return toCsvValue(row[f]); }).join(","));
      });
      output.value = lines.join("\n");
      status.textContent = "Converted " + result.rows.length + " <" + result.recordTag + "> record(s) into CSV.";
      status.classList.add("is-saved");
    } catch (err) {
      output.value = "";
      status.textContent = err.message;
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });
  document.getElementById("btnDownload").addEventListener("click", function () {
    if (!output.value) return;
    var blob = new Blob([output.value], { type: "text/csv" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "converted.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    status.textContent = "";
  });

  input.value = SAMPLE;
})();
</script>
</body>
</html>
