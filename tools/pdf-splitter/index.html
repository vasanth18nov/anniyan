<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PDF Splitter — Free Online Tool | Anniyan</title>
<meta name="description" content="Extract a page range from a PDF into a new file, right in your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/pdf-splitter/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300eaff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../../index.html#tools" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Image &amp; PDF</p>
    <h1>PDF Splitter</h1>
    <p>Upload a PDF and extract a specific page range into a new file.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>Drop a PDF here, or click to choose one</div>
      <input type="file" id="fileInput" accept="application/pdf" />
    </div>

    <p class="tool-status" id="fileInfo"></p>

    <div class="tool-row" id="rangeRow" style="display: none;">
      <div class="tool-field" style="flex: 1; min-width: 220px;">
        <label for="range">Pages to extract (e.g. 1-3,5)</label>
        <input class="tool-input" id="range" type="text" placeholder="1-3,5" style="width: 100%;" />
      </div>
      <button class="btn btn-primary btn-sm" id="btnExtract" type="button">Extract &amp; Download</button>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../../index.html#tools">Browse the full toolkit</a>.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var fileInfo = document.getElementById("fileInfo");
  var rangeRow = document.getElementById("rangeRow");
  var rangeInput = document.getElementById("range");
  var status = document.getElementById("status");

  var currentFile = null;
  var totalPages = 0;

  function parseRange(str, total) {
    var indices = [];
    str.split(",").forEach(function (part) {
      part = part.trim();
      if (!part) return;
      var m = part.match(/^(\d+)\s*-\s*(\d+)$/);
      if (m) {
        var a = parseInt(m[1], 10), b = parseInt(m[2], 10);
        for (var i = Math.min(a, b); i <= Math.max(a, b); i++) {
          if (i >= 1 && i <= total && indices.indexOf(i - 1) === -1) indices.push(i - 1);
        }
      } else {
        var n = parseInt(part, 10);
        if (n >= 1 && n <= total && indices.indexOf(n - 1) === -1) indices.push(n - 1);
      }
    });
    return indices;
  }

  async function handleFile(file) {
    if (!file || (file.type !== "application/pdf" && !/\.pdf$/i.test(file.name))) {
      fileInfo.textContent = "Please choose a PDF file.";
      rangeRow.style.display = "none";
      return;
    }
    currentFile = file;
    fileInfo.textContent = "Reading " + file.name + "…";
    try {
      var bytes = await file.arrayBuffer();
      var pdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      totalPages = pdf.getPageCount();
      fileInfo.textContent = file.name + " — " + totalPages + " page" + (totalPages === 1 ? "" : "s") + ".";
      rangeRow.style.display = "flex";
      rangeInput.value = "1-" + totalPages;
    } catch (err) {
      fileInfo.textContent = "Couldn't read that PDF: " + err.message;
      rangeRow.style.display = "none";
    }
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { handleFile(fileInput.files[0]); });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("is-dragover"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("is-dragover"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("is-dragover");
    handleFile(e.dataTransfer.files[0]);
  });

  document.getElementById("btnExtract").addEventListener("click", async function () {
    if (!currentFile) return;
    var indices = parseRange(rangeInput.value, totalPages);
    if (indices.length === 0) {
      status.textContent = "Enter a valid page range, e.g. 1-3,5.";
      status.classList.remove("is-saved");
      return;
    }
    status.textContent = "Extracting…";
    try {
      var bytes = await currentFile.arrayBuffer();
      var srcPdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
      var newPdf = await PDFLib.PDFDocument.create();
      var pages = await newPdf.copyPages(srcPdf, indices);
      pages.forEach(function (p) { newPdf.addPage(p); });
      var outBytes = await newPdf.save();
      var blob = new Blob([outBytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "extracted.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status.textContent = "Extracted " + indices.length + " page(s). Download started.";
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't extract pages: " + err.message;
      status.classList.remove("is-saved");
    }
  });
})();
</script>
</body>
</html>
