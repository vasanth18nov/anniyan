<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Image &amp; PDF</p>
    <h1>Image to PDF</h1>
    <p>Turn one or more images into a PDF, one image per page, in the order you choose.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>Drop images here, or click to choose</div>
      <input type="file" id="fileInput" accept="image/png, image/jpeg, image/webp" multiple />
    </div>

    <div class="tool-file-list" id="fileList"></div>

    <div class="tool-toolbar" style="margin-top: 20px; margin-bottom: 0;">
      <button class="btn btn-primary btn-sm" id="btnCreate" type="button" disabled>Create PDF &amp; Download</button>
      <button class="btn btn-outline btn-sm" id="btnClearAll" type="button">Clear All</button>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>. &middot; <a href="../../privacy/">Privacy</a> &middot; <a href="../../terms/">Terms</a></p>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var fileList = document.getElementById("fileList");
  var status = document.getElementById("status");
  var btnCreate = document.getElementById("btnCreate");

  var files = [];

  function render() {
    fileList.innerHTML = "";
    files.forEach(function (file, idx) {
      var row = document.createElement("div");
      row.className = "tool-file-row";
      row.innerHTML =
        '<span>' + (idx + 1) + ". " + file.name + "</span>" +
        '<span style="display:flex; gap:8px;">' +
        '<button type="button" data-action="up" data-idx="' + idx + '" aria-label="Move up">↑</button>' +
        '<button type="button" data-action="down" data-idx="' + idx + '" aria-label="Move down">↓</button>' +
        '<button type="button" data-action="remove" data-idx="' + idx + '" aria-label="Remove">✕</button>' +
        "</span>";
      fileList.appendChild(row);
    });
    btnCreate.disabled = files.length === 0;
    status.textContent = files.length === 0 ? "" : files.length + " image(s) ready — one per page.";
  }

  function addFiles(fileListInput) {
    Array.prototype.forEach.call(fileListInput, function (f) {
      if (f.type.indexOf("image/") === 0) files.push(f);
    });
    render();
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("is-dragover"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("is-dragover"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("is-dragover");
    addFiles(e.dataTransfer.files);
  });

  fileList.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var idx = Number(btn.dataset.idx);
    if (btn.dataset.action === "remove") {
      files.splice(idx, 1);
    } else if (btn.dataset.action === "up" && idx > 0) {
      var tmp = files[idx - 1]; files[idx - 1] = files[idx]; files[idx] = tmp;
    } else if (btn.dataset.action === "down" && idx < files.length - 1) {
      var tmp2 = files[idx + 1]; files[idx + 1] = files[idx]; files[idx] = tmp2;
    }
    render();
  });

  document.getElementById("btnClearAll").addEventListener("click", function () {
    files = [];
    render();
  });

  function loadImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () { resolve(img); URL.revokeObjectURL(url); };
      img.onerror = function () { reject(new Error("Couldn't load " + file.name)); };
      img.src = url;
    });
  }

  function imageToJpegBytes(img) {
    var canvas = document.createElement("canvas");
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    var ctx = canvas.getContext("2d");
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    return new Promise(function (resolve) {
      canvas.toBlob(async function (blob) {
        var buf = await blob.arrayBuffer();
        resolve({ bytes: new Uint8Array(buf), width: canvas.width, height: canvas.height });
      }, "image/jpeg", 0.92);
    });
  }

  btnCreate.addEventListener("click", async function () {
    if (files.length === 0) return;
    btnCreate.disabled = true;
    status.textContent = "Building PDF…";
    status.classList.remove("is-saved");
    try {
      var pdfDoc = await PDFLib.PDFDocument.create();
      for (var i = 0; i < files.length; i++) {
        var img = await loadImage(files[i]);
        var jpeg = await imageToJpegBytes(img);
        var embedded = await pdfDoc.embedJpg(jpeg.bytes);
        var pageWidthPt = jpeg.width * 0.75;
        var pageHeightPt = jpeg.height * 0.75;
        var page = pdfDoc.addPage([pageWidthPt, pageHeightPt]);
        page.drawImage(embedded, { x: 0, y: 0, width: pageWidthPt, height: pageHeightPt });
      }
      var pdfBytes = await pdfDoc.save();
      var blob = new Blob([pdfBytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "images.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status.textContent = "Created a " + files.length + "-page PDF. Download started.";
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't create PDF: " + err.message;
    }
    btnCreate.disabled = files.length === 0;
  });
})();
</script>
