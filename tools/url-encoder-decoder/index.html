<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>URL Encoder/Decoder — Free Online Tool | Anniyan</title>
<meta name="description" content="Encode or decode URL-safe strings and full URIs instantly in your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/url-encoder-decoder/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300eaff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Developer</p>
    <h1>URL Encoder / Decoder</h1>
    <p>Encode special characters for use in a URL, or decode a URL-encoded string back to plain text.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-toolbar">
      <label class="tool-checkbox-row"><input type="checkbox" id="componentMode" checked /> Component mode (encode ?, &amp;, / too)</label>
    </div>
    <span class="tool-split-label">Input</span>
    <textarea class="tool-textarea" id="input" placeholder="Paste text or a URL here…" style="min-height: 220px; margin-top: 8px;"></textarea>

    <div class="tool-toolbar" style="margin-top: 18px; margin-bottom: 0;">
      <button class="btn btn-primary btn-sm" id="btnEncode" type="button">Encode</button>
      <button class="btn btn-outline btn-sm" id="btnDecode" type="button">Decode</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy Output</button>
      <button class="btn btn-outline btn-sm" id="btnClear" type="button">Clear</button>
    </div>

    <span class="tool-split-label" style="display: block; margin-top: 18px;">Result</span>
    <textarea class="tool-textarea" id="output" readonly style="min-height: 220px; margin-top: 8px;"></textarea>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var status = document.getElementById("status");
  var componentMode = document.getElementById("componentMode");

  document.getElementById("btnEncode").addEventListener("click", function () {
    try {
      output.value = componentMode.checked ? encodeURIComponent(input.value) : encodeURI(input.value);
      status.textContent = "Encoded using " + (componentMode.checked ? "encodeURIComponent." : "encodeURI.");
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't encode: " + err.message;
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnDecode").addEventListener("click", function () {
    try {
      output.value = componentMode.checked ? decodeURIComponent(input.value) : decodeURI(input.value);
      status.textContent = "Decoded using " + (componentMode.checked ? "decodeURIComponent." : "decodeURI.");
      status.classList.add("is-saved");
    } catch (err) {
      output.value = "";
      status.textContent = "Couldn't decode: malformed input.";
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    status.textContent = "";
  });
})();
</script>
</body>
</html>
