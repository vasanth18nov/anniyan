<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Image &amp; PDF</p>
    <h1>PDF Merger</h1>
    <p>Combine multiple PDF files into one, in the order you choose. Files are merged locally in your browser.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>Drop PDF files here, or click to choose</div>
      <input type="file" id="fileInput" accept="application/pdf" multiple />
    </div>

    <div class="tool-file-list" id="fileList"></div>

    <div class="tool-toolbar" style="margin-top: 20px; margin-bottom: 0;">
      <button class="btn btn-primary btn-sm" id="btnMerge" type="button" disabled>Merge &amp; Download</button>
      <button class="btn btn-outline btn-sm" id="btnClearAll" type="button">Clear All</button>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>. &middot; <a href="../../privacy/">Privacy</a> &middot; <a href="../../terms/">Terms</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
(function () {
  "use strict";
  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var fileList = document.getElementById("fileList");
  var status = document.getElementById("status");
  var btnMerge = document.getElementById("btnMerge");

  var files = [];

  function formatBytes(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(2) + " MB";
  }

  function render() {
    fileList.innerHTML = "";
    files.forEach(function (file, idx) {
      var row = document.createElement("div");
      row.className = "tool-file-row";
      row.innerHTML =
        '<span>' + (idx + 1) + ". " + file.name + " (" + formatBytes(file.size) + ")</span>" +
        '<span style="display:flex; gap:8px;">' +
        '<button type="button" data-action="up" data-idx="' + idx + '" aria-label="Move up">↑</button>' +
        '<button type="button" data-action="down" data-idx="' + idx + '" aria-label="Move down">↓</button>' +
        '<button type="button" data-action="remove" data-idx="' + idx + '" aria-label="Remove">✕</button>' +
        "</span>";
      fileList.appendChild(row);
    });
    btnMerge.disabled = files.length < 2;
    status.textContent = files.length === 0 ? "" : files.length === 1 ? "Add at least one more PDF to merge." : files.length + " files ready to merge.";
  }

  function addFiles(fileListInput) {
    Array.prototype.forEach.call(fileListInput, function (f) {
      if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) files.push(f);
    });
    render();
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("is-dragover"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("is-dragover"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("is-dragover");
    addFiles(e.dataTransfer.files);
  });

  fileList.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var idx = Number(btn.dataset.idx);
    if (btn.dataset.action === "remove") {
      files.splice(idx, 1);
    } else if (btn.dataset.action === "up" && idx > 0) {
      var tmp = files[idx - 1]; files[idx - 1] = files[idx]; files[idx] = tmp;
    } else if (btn.dataset.action === "down" && idx < files.length - 1) {
      var tmp2 = files[idx + 1]; files[idx + 1] = files[idx]; files[idx] = tmp2;
    }
    render();
  });

  document.getElementById("btnClearAll").addEventListener("click", function () {
    files = [];
    render();
  });

  btnMerge.addEventListener("click", async function () {
    if (files.length < 2) return;
    btnMerge.disabled = true;
    status.textContent = "Merging…";
    status.classList.remove("is-saved");
    try {
      var mergedPdf = await PDFLib.PDFDocument.create();
      for (var i = 0; i < files.length; i++) {
        var bytes = await files[i].arrayBuffer();
        var pdf = await PDFLib.PDFDocument.load(bytes, { ignoreEncryption: true });
        var pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
        pages.forEach(function (p) { mergedPdf.addPage(p); });
      }
      var mergedBytes = await mergedPdf.save();
      var blob = new Blob([mergedBytes], { type: "application/pdf" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "merged.pdf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      status.textContent = "Merged " + files.length + " files. Download started.";
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't merge: " + err.message;
    }
    btnMerge.disabled = files.length < 2;
  });
})();
</script>
