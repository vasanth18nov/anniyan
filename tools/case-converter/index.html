<main class="tool-main">

    <p>Switch your text between upper, lower, title and sentence case with one click.</p>
  </div>

    <div class="tool-toolbar">
      <button class="btn btn-primary btn-sm" data-case="upper" type="button">UPPERCASE</button>
      <button class="btn btn-outline btn-sm" data-case="lower" type="button">lowercase</button>
      <button class="btn btn-outline btn-sm" data-case="title" type="button">Title Case</button>
      <button class="btn btn-outline btn-sm" data-case="sentence" type="button">Sentence case</button>
      <button class="btn btn-outline btn-sm" data-case="alternating" type="button">aLtErNaTiNg</button>
    </div>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var status = document.getElementById("status");

  function toTitleCase(text) {
    return text.replace(/\w\S*/g, function (word) {
      return word.charAt(0).toUpperCase() + word.slice(1).toLowerCase();
    });
  }

  function toSentenceCase(text) {
    var lower = text.toLowerCase();
    return lower.replace(/(^\s*\w|[.!?]\s+\w)/g, function (match) {
      return match.toUpperCase();
    });
  }

  function toAlternatingCase(text) {
    var out = "";
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      out += /[a-z]/i.test(ch) ? (i % 2 === 0 ? ch.toLowerCase() : ch.toUpperCase()) : ch;
    }
    return out;
  }

  var converters = {
    upper: function (t) { return t.toUpperCase(); },
    lower: function (t) { return t.toLowerCase(); },
    title: toTitleCase,
    sentence: toSentenceCase,
    alternating: toAlternatingCase
  };

  document.querySelectorAll("[data-case]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var fn = converters[btn.dataset.case];
      input.value = fn(input.value);
      status.textContent = "Converted to " + btn.textContent.trim().toLowerCase() + ".";
      input.focus();
    });
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(input.value).then(function () {
      status.textContent = "Copied to clipboard.";
    });
  });

  document.getElementById("btnClear").addEventListener("click", function () {
    input.value = "";
    status.textContent = "";
    input.focus();
  });
})();
</script>
