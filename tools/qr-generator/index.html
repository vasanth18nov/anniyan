  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Generators</p>
    <h1>QR Code Generator</h1>
    <p>Turn any text or link into a scannable QR code, generated locally and ready to download.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-row">
      <div class="tool-field" style="flex: 1; min-width: 240px;">
        <label for="text">Text or URL</label>
        <input class="tool-input" id="text" type="text" style="width: 100%;" />
      </div>
      <div class="tool-field">
        <label for="ecLevel">Error Correction</label>
        <select class="tool-select" id="ecLevel">
          <option value="L">Low</option>
          <option value="M" selected>Medium</option>
          <option value="Q">Quartile</option>
          <option value="H">High</option>
        </select>
      </div>
    </div>
    <div class="tool-toolbar">
      <button class="btn btn-primary btn-sm" id="btnGenerate" type="button">Generate</button>
      <button class="btn btn-outline btn-sm" id="btnDownload" type="button">Download PNG</button>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <div style="display: inline-block; background: #ffffff; padding: 18px; border-radius: 16px;">
        <canvas id="qrCanvas"></canvas>
      </div>
    </div>

  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>. &middot; <a href="../../privacy/">Privacy</a> &middot; <a href="../../terms/">Terms</a></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function () {
  "use strict";
  var textInput = document.getElementById("text");
  var canvas = document.getElementById("qrCanvas");
  var status = document.getElementById("status");
  var ecLevel = document.getElementById("ecLevel");

  function generate() {
    var text = textInput.value.trim();
    if (!text) {
      status.textContent = "Enter some text or a URL.";
      status.classList.remove("is-saved");
      return;
    }
    try {
      var qr = qrcode(0, ecLevel.value);
      qr.addData(text);
      qr.make();
      var count = qr.getModuleCount();
      var cell = Math.max(1, Math.floor(320 / count));
      var size = cell * count;
      canvas.width = size;
      canvas.height = size;
      var ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = "#0a0e1a";
      for (var row = 0; row < count; row++) {
        for (var col = 0; col < count; col++) {
          if (qr.isDark(row, col)) ctx.fillRect(col * cell, row * cell, cell, cell);
        }
      }
      status.textContent = "QR code generated (" + count + "×" + count + " modules).";
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't generate a QR code for that input: " + err.message;
      status.classList.remove("is-saved");
    }
  }

  document.getElementById("btnGenerate").addEventListener("click", generate);
  document.getElementById("btnDownload").addEventListener("click", function () {
    if (!canvas.width) return;
    var url = canvas.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url;
    a.download = "qrcode.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  textInput.value = "https://anniyan.online";
  generate();
})();
</script>
