<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Base64 Encoder — Free Online Tool | Anniyan</title>
<meta name="description" content="Encode or decode Base64 strings and files, entirely in your browser." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/base64-encoder/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300eaff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../../index.html#tools" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Developer</p>
    <h1>Base64 Encoder</h1>
    <p>Encode text or a file to Base64, or decode a Base64 string back to text — nothing leaves your browser.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-toolbar">
      <button class="btn btn-primary btn-sm" id="btnEncode" type="button">Encode</button>
      <button class="btn btn-outline btn-sm" id="btnDecode" type="button">Decode</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy Output</button>
      <button class="btn btn-outline btn-sm" id="btnClear" type="button">Clear</button>
    </div>
    <div class="tool-split">
      <div class="tool-split-col">
        <span class="tool-split-label">Text / Base64</span>
        <textarea class="tool-textarea" id="input" placeholder="Type text to encode, or paste Base64 to decode…" style="min-height:280px;"></textarea>
      </div>
      <div class="tool-split-col">
        <span class="tool-split-label">Result</span>
        <textarea class="tool-textarea" id="output" readonly style="min-height:280px;"></textarea>
      </div>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <section class="card tool-panel">
    <h3 style="margin-bottom: 14px;">Encode a File</h3>
    <div class="tool-dropzone" id="dropzone">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <div>Drop a file here, or click to choose one</div>
      <input type="file" id="fileInput" />
    </div>
    <p class="tool-status" id="fileStatus"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../../index.html#tools">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var status = document.getElementById("status");

  function utf8ToB64(str) {
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function (m, p1) {
      return String.fromCharCode("0x" + p1);
    }));
  }
  function b64ToUtf8(str) {
    return decodeURIComponent(atob(str).split("").map(function (c) {
      return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
  }

  document.getElementById("btnEncode").addEventListener("click", function () {
    try {
      output.value = utf8ToB64(input.value);
      status.textContent = "Encoded.";
      status.classList.add("is-saved");
    } catch (err) {
      status.textContent = "Couldn't encode: " + err.message;
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnDecode").addEventListener("click", function () {
    try {
      output.value = b64ToUtf8(input.value.trim());
      status.textContent = "Decoded.";
      status.classList.add("is-saved");
    } catch (err) {
      output.value = "";
      status.textContent = "Couldn't decode: invalid Base64 input.";
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    status.textContent = "";
  });

  var dropzone = document.getElementById("dropzone");
  var fileInput = document.getElementById("fileInput");
  var fileStatus = document.getElementById("fileStatus");

  function handleFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var dataUrl = reader.result;
      var b64 = dataUrl.split(",")[1] || "";
      output.value = b64;
      fileStatus.textContent = "Encoded \"" + file.name + "\" (" + Math.round(file.size / 1024) + " KB) to Base64 below.";
      input.value = "";
    };
    reader.readAsDataURL(file);
  }

  dropzone.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function () { handleFile(fileInput.files[0]); });
  dropzone.addEventListener("dragover", function (e) { e.preventDefault(); dropzone.classList.add("is-dragover"); });
  dropzone.addEventListener("dragleave", function () { dropzone.classList.remove("is-dragover"); });
  dropzone.addEventListener("drop", function (e) {
    e.preventDefault();
    dropzone.classList.remove("is-dragover");
    handleFile(e.dataTransfer.files[0]);
  });
})();
</script>
</body>
</html>
