<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To-Do List — Free Online Tool | Anniyan</title>
<meta name="description" content="A simple browser-based checklist for daily tasks, saved automatically." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://anniyan.online/tools/todo-list/" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300eaff'/%3E%3Cstop offset='1' stop-color='%238a5cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0e1a'/%3E%3Ctext x='50' y='68' font-size='58' font-family='Arial, sans-serif' font-weight='700' fill='url(%23g)' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../styles.css" />
<link rel="stylesheet" href="../tools.css" />
</head>
<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Productivity</p>
    <h1>To-Do List</h1>
    <p>A simple checklist for daily tasks. Saved automatically to this browser.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-copy-row">
      <input class="tool-input" id="newTask" type="text" placeholder="Add a task and press Enter…" />
      <button class="btn btn-primary btn-sm" id="btnAdd" type="button">Add</button>
    </div>

    <div class="tool-list" id="list"></div>

    <div class="tool-toolbar" style="margin-top: 18px; margin-bottom: 0; justify-content: space-between;">
      <p class="tool-status" id="status" style="margin: 0;"></p>
      <button class="btn btn-outline btn-sm" id="btnClearDone" type="button">Clear Completed</button>
    </div>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>.</p>
</main>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "anniyan-todo-list";
  var newTask = document.getElementById("newTask");
  var list = document.getElementById("list");
  var status = document.getElementById("status");

  var tasks = [];
  try {
    tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (err) {
    tasks = [];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render() {
    list.innerHTML = "";
    tasks.forEach(function (task, idx) {
      var row = document.createElement("div");
      row.className = "tool-list-item" + (task.done ? " is-done" : "");
      row.innerHTML =
        '<button type="button" data-action="toggle" data-idx="' + idx + '" aria-label="Toggle complete">' + (task.done ? "☑" : "☐") + "</button>" +
        '<span class="tool-list-text">' + escapeHtml(task.text) + "</span>" +
        '<button type="button" data-action="delete" data-idx="' + idx + '" aria-label="Delete">✕</button>';
      list.appendChild(row);
    });
    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    status.textContent = tasks.length === 0 ? "No tasks yet." : remaining + " of " + tasks.length + " remaining.";
  }

  function addTask() {
    var text = newTask.value.trim();
    if (!text) return;
    tasks.push({ text: text, done: false });
    newTask.value = "";
    save();
    render();
  }

  document.getElementById("btnAdd").addEventListener("click", addTask);
  newTask.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var idx = Number(btn.dataset.idx);
    if (btn.dataset.action === "toggle") tasks[idx].done = !tasks[idx].done;
    else if (btn.dataset.action === "delete") tasks.splice(idx, 1);
    save();
    render();
  });

  document.getElementById("btnClearDone").addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save();
    render();
  });

  render();
})();
</script>
</body>
</html>
