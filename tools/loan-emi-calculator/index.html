<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Calculators</p>
    <h1>Loan EMI Calculator</h1>
    <p>Estimate your monthly loan payment, total interest and total amount payable.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label for="principal">Loan Amount</label>
        <input class="tool-input" id="principal" type="number" value="500000" style="width: 160px;" />
      </div>
      <div class="tool-field">
        <label for="rate">Interest Rate (% per year)</label>
        <input class="tool-input" id="rate" type="number" step="0.1" value="9.5" style="width: 140px;" />
      </div>
      <div class="tool-field">
        <label for="tenure">Tenure</label>
        <input class="tool-input" id="tenure" type="number" value="5" style="width: 100px;" />
      </div>
      <div class="tool-field">
        <label for="tenureUnit">&nbsp;</label>
        <select class="tool-select" id="tenureUnit">
          <option value="years">Years</option>
          <option value="months">Months</option>
        </select>
      </div>
    </div>

    <div class="tool-stats">
      <div class="tool-stat"><div class="tool-stat-value" id="statEmi">—</div><div class="tool-stat-label">Monthly EMI</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statInterest">—</div><div class="tool-stat-label">Total Interest</div></div>
      <div class="tool-stat"><div class="tool-stat-value" id="statTotal">—</div><div class="tool-stat-label">Total Payment</div></div>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>. &middot; <a href="../../privacy/">Privacy</a> &middot; <a href="../../terms/">Terms</a></p>
</main>

<script>
(function () {
  "use strict";
  var principal = document.getElementById("principal");
  var rate = document.getElementById("rate");
  var tenure = document.getElementById("tenure");
  var tenureUnit = document.getElementById("tenureUnit");
  var status = document.getElementById("status");

  function fmt(n) {
    return n.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 });
  }

  function calc() {
    var P = parseFloat(principal.value) || 0;
    var annualRate = parseFloat(rate.value) || 0;
    var tenureRaw = parseFloat(tenure.value) || 0;
    var n = tenureUnit.value === "years" ? tenureRaw * 12 : tenureRaw;

    if (P <= 0 || n <= 0) {
      status.textContent = "Enter a loan amount and tenure greater than zero.";
      return;
    }

    var r = annualRate / 12 / 100;
    var emi;
    if (r === 0) {
      emi = P / n;
    } else {
      var factor = Math.pow(1 + r, n);
      emi = (P * r * factor) / (factor - 1);
    }
    var totalPayment = emi * n;
    var totalInterest = totalPayment - P;

    document.getElementById("statEmi").textContent = fmt(emi);
    document.getElementById("statInterest").textContent = fmt(totalInterest);
    document.getElementById("statTotal").textContent = fmt(totalPayment);
    status.textContent = "Based on " + n + " monthly installments.";
  }

  [principal, rate, tenure, tenureUnit].forEach(function (el) {
    el.addEventListener("input", calc);
    el.addEventListener("change", calc);
  });

  calc();
})();
</script>
