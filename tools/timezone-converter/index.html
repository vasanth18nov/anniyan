<script>
(function () {
  "use strict";
  var ZONES = [
    { id: "UTC", label: "UTC" },
    { id: "America/Los_Angeles", label: "Los Angeles" },
    { id: "America/New_York", label: "New York" },
    { id: "America/Chicago", label: "Chicago" },
    { id: "Europe/London", label: "London" },
    { id: "Europe/Paris", label: "Paris" },
    { id: "Asia/Dubai", label: "Dubai" },
    { id: "Asia/Kolkata", label: "India (Kolkata)" },
    { id: "Asia/Kuala_Lumpur", label: "Kuala Lumpur" },
    { id: "Asia/Singapore", label: "Singapore" },
    { id: "Asia/Tokyo", label: "Tokyo" },
    { id: "Australia/Sydney", label: "Sydney" }
  ];

  var dateTimeInput = document.getElementById("dateTime");
  var sourceZone = document.getElementById("sourceZone");
  var results = document.getElementById("results");
  var status = document.getElementById("status");

  sourceZone.innerHTML = ZONES.map(function (z) {
    return '<option value="' + z.id + '">' + z.label + " (" + z.id + ")</option>";
  }).join("");

  function zonedTimeToUtc(dateTimeLocalStr, timeZone) {
    var naiveDate = new Date(dateTimeLocalStr + "Z");
    var tzString = naiveDate.toLocaleString("en-US", { timeZone: timeZone });
    var utcString = naiveDate.toLocaleString("en-US", { timeZone: "UTC" });
    var offset = new Date(utcString).getTime() - new Date(tzString).getTime();
    return new Date(naiveDate.getTime() + offset);
  }

  function formatInZone(date, timeZone) {
    return new Intl.DateTimeFormat("en-US", {
      timeZone: timeZone,
      weekday: "short",
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      hour12: true
    }).format(date);
  }

  function render() {
    if (!dateTimeInput.value) { status.textContent = "Pick a date and time."; return; }
    var utcInstant;
    try {
      utcInstant = zonedTimeToUtc(dateTimeInput.value, sourceZone.value);
    } catch (err) {
      status.textContent = "Couldn't convert: " + err.message;
      return;
    }

    results.innerHTML = "";
    ZONES.forEach(function (z) {
      var row = document.createElement("div");
      row.className = "tool-list-item";
      row.innerHTML = '<span class="tool-list-text"><strong>' + z.label + "</strong> — " + formatInZone(utcInstant, z.id) + "</span>";
      results.appendChild(row);
    });
    status.textContent = "";
  }

  dateTimeInput.addEventListener("input", render);
  sourceZone.addEventListener("change", render);

  var now = new Date();
  var pad = function (n) { return ("0" + n).slice(-2); };
  dateTimeInput.value = now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate()) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
  var localZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  var match = ZONES.some(function (z) { return z.id === localZone; });
  if (match) sourceZone.value = localZone;
  else sourceZone.value = "UTC";

  render();
})();
</script>
