<body class="tool-body">

<header class="tool-topbar">
  <div class="tool-topbar-inner">
    <a href="../" class="tool-back">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Back to Anniyan
    </a>
    <span class="tool-brand"><span class="logo-mark">A</span> Anniyan Tools</span>
  </div>
</header>

<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Generators</p>
    <h1>Lorem Ipsum Generator</h1>
    <p>Generate placeholder text for design mockups and layouts.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label for="mode">Generate</label>
        <select class="tool-select" id="mode">
          <option value="paragraphs">Paragraphs</option>
          <option value="sentences">Sentences</option>
          <option value="words">Words</option>
        </select>
      </div>
      <div class="tool-field">
        <label for="count">Count</label>
        <input class="tool-input" id="count" type="number" min="1" max="50" value="3" style="width: 100px;" />
      </div>
      <label class="tool-checkbox-row" style="margin-bottom: 11px;"><input type="checkbox" id="classicStart" checked /> Start with "Lorem ipsum dolor sit amet…"</label>
      <button class="btn btn-primary btn-sm" id="btnGenerate" type="button">Generate</button>
    </div>

    <textarea class="tool-textarea" id="output" readonly style="min-height: 320px;"></textarea>
    <div class="tool-toolbar" style="margin-top: 18px; margin-bottom: 0;">
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy</button>
      <button class="btn btn-outline btn-sm" id="btnDownload" type="button">Download .txt</button>
    </div>
    <p class="tool-status" id="status"></p>
  </section>

  <p class="tool-footer-note">Need more tools? <a href="../">Browse the full toolkit</a>. &middot; <a href="../../privacy/">Privacy</a> &middot; <a href="../../terms/">Terms</a></p>
</main>

<script>
(function () {
  "use strict";
  var WORDS = ("lorem ipsum dolor sit amet consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore " +
    "et dolore magna aliqua enim ad minim veniam quis nostrud exercitation ullamco laboris nisi aliquip ex ea " +
    "commodo consequat duis aute irure in reprehenderit voluptate velit esse cillum eu fugiat nulla pariatur " +
    "excepteur sint occaecat cupidatat non proident sunt culpa qui officia deserunt mollit anim id est laborum " +
    "at vero eos accusamus iusto odio dignissimos ducimus blanditiis praesentium voluptatum deleniti").split(" ");

  var output = document.getElementById("output");
  var status = document.getElementById("status");
  var mode = document.getElementById("mode");
  var count = document.getElementById("count");
  var classicStart = document.getElementById("classicStart");

  function pick() { return WORDS[Math.floor(Math.random() * WORDS.length)]; }

  function randomWords(n) {
    var out = [];
    for (var i = 0; i < n; i++) out.push(pick());
    return out;
  }

  function sentence() {
    var len = 6 + Math.floor(Math.random() * 10);
    var words = randomWords(len);
    var text = words.join(" ");
    return text.charAt(0).toUpperCase() + text.slice(1) + ".";
  }

  function paragraph() {
    var count = 3 + Math.floor(Math.random() * 4);
    var sentences = [];
    for (var i = 0; i < count; i++) sentences.push(sentence());
    return sentences.join(" ");
  }

  function generate() {
    var n = Math.min(50, Math.max(1, parseInt(count.value, 10) || 1));
    var result = "";

    if (mode.value === "words") {
      var words = randomWords(n);
      if (classicStart.checked) {
        var prefix = ["Lorem", "ipsum", "dolor", "sit", "amet"].slice(0, n);
        words = prefix.concat(randomWords(Math.max(0, n - prefix.length)));
      }
      result = words.join(" ");
    } else if (mode.value === "sentences") {
      var sentences = [];
      for (var i = 0; i < n; i++) sentences.push(sentence());
      if (classicStart.checked) sentences[0] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit.";
      result = sentences.join(" ");
    } else {
      var paragraphs = [];
      for (var p = 0; p < n; p++) paragraphs.push(paragraph());
      if (classicStart.checked) paragraphs[0] = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. " + paragraphs[0];
      result = paragraphs.join("\n\n");
    }

    output.value = result;
    status.textContent = "Generated " + n + " " + mode.value + ".";
    status.classList.add("is-saved");
  }

  document.getElementById("btnGenerate").addEventListener("click", generate);
  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });
  document.getElementById("btnDownload").addEventListener("click", function () {
    if (!output.value) return;
    var blob = new Blob([output.value], { type: "text/plain" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "lorem-ipsum.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  generate();
})();
</script>
