<main class="tool-main">
  <div class="tool-heading">
    <p class="section-eyebrow">Data Conversion</p>
    <h1>CSV to JSON</h1>
    <p>Paste CSV with a header row and convert each row into a JSON object. Handles quoted fields with commas and newlines.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-toolbar">
      <button class="btn btn-primary btn-sm" id="btnConvert" type="button">Convert</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy JSON</button>
      <button class="btn btn-outline btn-sm" id="btnDownload" type="button">Download .json</button>
      <button class="btn btn-outline btn-sm" id="btnClear" type="button">Clear</button>
    </div>
    <div class="tool-split">
      <div class="tool-split-col">
        <span class="tool-split-label">CSV Input</span>
        <textarea class="tool-textarea" id="input" style="min-height:340px;"></textarea>
      </div>
      <div class="tool-split-col">
        <span class="tool-split-label">JSON Output</span>
        <textarea class="tool-textarea" id="output" readonly style="min-height:340px;"></textarea>
      </div>
    </div>

  </section>

</main>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var status = document.getElementById("status");

  var SAMPLE = 'name,age,city\nRavi,29,Chennai\nMeera,34,Coimbatore\n"Kumar, S.",41,Bengaluru';

  function parseCsv(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === ",") { row.push(field); field = ""; }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (ch === "\r") { /* ignore, \n handles line break */ }
        else { field += ch; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return !(r.length === 1 && r[0] === ""); });
  }

  document.getElementById("btnConvert").addEventListener("click", function () {
    try {
      var rows = parseCsv(input.value.trim());
      if (rows.length === 0) throw new Error("No CSV data found.");
      var headers = rows[0];
      var objects = rows.slice(1).map(function (r) {
        var obj = {};
        headers.forEach(function (h, idx) { obj[h || "column" + idx] = r[idx] !== undefined ? r[idx] : ""; });
        return obj;
      });
      output.value = JSON.stringify(objects, null, 2);
      status.textContent = "Converted " + objects.length + " row(s) into JSON objects.";
      status.classList.add("is-saved");
    } catch (err) {
      output.value = "";
      status.textContent = err.message;
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });
  document.getElementById("btnDownload").addEventListener("click", function () {
    if (!output.value) return;
    var blob = new Blob([output.value], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "converted.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
  document.getElementById("btnClear").addEventListener("click", function () {
    input.value = "";
    output.value = "";
    status.textContent = "";
  });

  input.value = SAMPLE;
})();
</script>
