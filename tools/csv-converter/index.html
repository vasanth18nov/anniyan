    <p class="section-eyebrow">Data Conversion</p>
    <h1>CSV Converter</h1>
    <p>Convert data between CSV, TSV and JSON — pick your input and output formats.</p>
  </div>

  <section class="card tool-panel">
    <div class="tool-row">
      <div class="tool-field">
        <label for="fromFormat">From</label>
        <select class="tool-select" id="fromFormat">
          <option value="csv">CSV</option>
          <option value="tsv">TSV</option>
          <option value="json">JSON</option>
        </select>

      <div class="tool-field">

        </select>
      </div>
      <button class="btn btn-primary btn-sm" id="btnConvert" type="button">Convert</button>
      <button class="btn btn-outline btn-sm" id="btnCopy" type="button">Copy Output</button>

    </div>

<script>
(function () {
  "use strict";
  var input = document.getElementById("input");
  var output = document.getElementById("output");
  var status = document.getElementById("status");
  var fromFormat = document.getElementById("fromFormat");
  var toFormat = document.getElementById("toFormat");

  var SAMPLE = "name,age,city\nRavi,29,Chennai\nMeera,34,Coimbatore";

  function parseDelimited(text, delimiter) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var next = text[i + 1];
      if (inQuotes) {
        if (ch === '"' && next === '"') { field += '"'; i++; }
        else if (ch === '"') { inQuotes = false; }
        else { field += ch; }
      } else {
        if (ch === '"') { inQuotes = true; }
        else if (ch === delimiter) { row.push(field); field = ""; }
        else if (ch === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
        else if (ch === "\r") { /* ignore */ }
        else { field += ch; }
      }
    }
    if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return !(r.length === 1 && r[0] === ""); });
  }

  function delimitedToObjects(text, delimiter) {
    var rows = parseDelimited(text.trim(), delimiter);
    if (rows.length === 0) throw new Error("No data found.");
    var headers = rows[0];
    return rows.slice(1).map(function (r) {
      var obj = {};
      headers.forEach(function (h, idx) { obj[h || "column" + idx] = r[idx] !== undefined ? r[idx] : ""; });
      return obj;
    });
  }

  function objectsToDelimited(objects, delimiter) {
    if (objects.length === 0) return "";
    var fields = [];
    objects.forEach(function (o) {
      Object.keys(o).forEach(function (k) { if (fields.indexOf(k) === -1) fields.push(k); });
    });
    function esc(v) {
      if (v === undefined || v === null) v = "";
      v = String(v);
      if (v.indexOf(delimiter) !== -1 || v.indexOf('"') !== -1 || v.indexOf("\n") !== -1) {
        v = '"' + v.replace(/"/g, '""') + '"';
      }
      return v;
    }
    var lines = [fields.map(esc).join(delimiter)];
    objects.forEach(function (o) { lines.push(fields.map(function (f) { return esc(o[f]); }).join(delimiter)); });
    return lines.join("\n");
  }

  function convert() {
    var from = fromFormat.value;
    var to = toFormat.value;
    var objects;

    if (from === "json") {
      var parsed = JSON.parse(input.value);
      objects = Array.isArray(parsed) ? parsed : [parsed];
    } else {
      objects = delimitedToObjects(input.value, from === "tsv" ? "\t" : ",");
    }

    if (to === "json") return JSON.stringify(objects, null, 2);
    return objectsToDelimited(objects, to === "tsv" ? "\t" : ",");
  }

  document.getElementById("btnConvert").addEventListener("click", function () {
    try {
      output.value = convert();
      status.textContent = "Converted from " + fromFormat.value.toUpperCase() + " to " + toFormat.value.toUpperCase() + ".";
      status.classList.add("is-saved");
    } catch (err) {
      output.value = "";
      status.textContent = "Couldn't convert: " + err.message;
      status.classList.remove("is-saved");
    }
  });

  document.getElementById("btnSwap").addEventListener("click", function () {
    var tmp = fromFormat.value;
    fromFormat.value = toFormat.value;
    toFormat.value = tmp;
    var tmpText = input.value;
    input.value = output.value;
    output.value = tmpText;
  });

  document.getElementById("btnCopy").addEventListener("click", function () {
    navigator.clipboard.writeText(output.value);
  });

  input.value = SAMPLE;
})();
</script>
